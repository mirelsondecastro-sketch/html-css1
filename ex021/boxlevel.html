<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixas!</title>
    <style>
        h1{
            border-width: 10px;
            border-color: black;
            height: 250px;
            width: 250px;
            border-style: solid;
            padding-top: 10px;
            padding-left: 10px;
            padding-right: 10px;
            padding-bottom: 10px;

        }
        a{
            border-width: 10px;
            border-color: blue;
            border-style: solid;
        }
    </style>
</head>
<body>
     <h1>Modelo de caixa box-level</h1>
     <p>O paragráfo também é um box-level, <a href="#">mas os links são os inline-level</a> </p>
    
</body>
</html>
