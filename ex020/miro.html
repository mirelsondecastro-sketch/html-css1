<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando Hover</title>
    <style>
        body{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        div > p{
            display: none;
            
        }
        div:hover >
        p{
         display: block;  
         color: white; 
         background-color: black ;
        }
       div:hover{
        color: blue;
       }
    


     </style>
</head>
<body>
      <h1>Exemplo utilizando o Hover</h1>
      <p>Passe o mouse sobre o texto abaixo</p>
      <div>Passse o mouse aqui!
        <p>Texto escondido!</p>
      </div>
      <p>Fim do exemplo</p>
</body>
</html>
