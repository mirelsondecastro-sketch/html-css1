<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fomrulário</title>
</head>
<body>
   <h1>Exemplo de formulário</h1> 
   <form action="cadastro.php" method="post">
    <p>
        <label for="inum">Número:</label>
        <input type="range" name="num" id="inum" required="50" oninput="inv.innerHTML = Number(inum.value)">
        <output name="nv" id="inv">50</output>
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Excluir">
    </p>
   </form>
</body>
</html>
