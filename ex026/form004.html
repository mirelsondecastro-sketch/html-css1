<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de cadastro</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <fieldset>
            <legend>Dados pessoais</legend>
            <p>
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome" required autocomplete="username" minlength="5" maxlength="30" placeholder="Digite o seu nome">
            </p>
            <p>
                <label for="iemail">E-mail:</label>
                <input type="email" name="email" id="iemail" required placeholder="Digite o seu e-mail" autocomplete="email">
            </p>
            <p>
                <label for="itel">Tel:</label>
                <input type="tel" name="tel" id="itel" required placeholder="(+244) xxx xxx xxx" autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" >
            </p>
        </fieldset>
        <input type="submit" value="Cadastrar">
        <input type="reset" value="Excluir">
    </form>
</body>
</html>
