<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Cadastro</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p><label for="inome">Nome:</label>
        <input type="text" name="nome" id="inome" placeholder="Digite o seu nome" minlength="5" maxlength="30" required autocomplete="name">
        </p>
        <p>
            <label for="imedia">Média:</label>
            <input type="number" name="media" id="imedia" placeholder="0 a 10" required min="0" max="10" step="0.1" >
        </p>
        <p>
            <label for="iemail">Email:</label>
            <input type="email" name="email" id="iemail" placeholder="Digite o seu email" autocomplete="email" required>
        </p>
        <p>
            <label for="isenha">Senha:</label>
            <input type="password" name="senha" id="isenha" placeholder="Digite a sua senha" autocomplete="new-password" minlength="8" maxlength="20" required>
        </p>
        <p>
            <label for="inum">Número:</label>
            <input type="tel" name="num" id="inum" autocomplete="tel" required placeholder="Digite o seu número">
        </p>
        <p>
            <label for="idata">Data de Nascimento:</label>
            <input type="date" name="data" id="idata" required >
        </p>
        <p>
            <label for="imes">Periódo Lectivo:</label>
            <input type="month" name="mes" id="imes" required>
        </p>
        <p>
            <label for="ihora">Horário:</label>
            <input type="time" name="hora" id="ihora" required>
        </p>
        <p>
            <input type="submit" value="Cadastrar">
            <input type="reset" value="Excluir">
        </p>
    </form>
</body>
</html>
